name: Run Unit Tests

on:
  workflow_call:
    inputs:
      packages:
        type: string
        description: 'JSON array of package directory names to test (e.g. ["cpf-val","cnpj-dv"])'
        required: true
      ruby-versions:
        type: string
        description: 'JSON array of Ruby versions (e.g. ["3.1","3.2","3.3","3.4","4.0"])'
        required: true
      max-parallel:
        type: number
        description: 'Maximum number of parallel jobs'
        required: false
        default: 5

permissions:
  contents: read

jobs:
  test:
    name: Test `${{ matrix.package }}` in Ruby v${{ matrix.ruby-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        ruby-version: ${{ fromJSON(inputs.ruby-versions) }}
        package: ${{ fromJSON(inputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run `${{ matrix.package }}` tests
        run: |
          cd "packages/${{ matrix.package }}"
          bundle install
          bundle exec rake test
